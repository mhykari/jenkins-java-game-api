<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guess The Number Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        h1 {
            text-align: center;
        }
        .result, .attempts, .log {
            margin-top: 15px;
        }
        input[type="number"] {
            width: 100px;
        }
        button {
            margin-left: 5px;
        }
        #logList {
            list-style: none;
            padding-left: 0;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 5px;
        }
        #logList li {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<h1>Guess The Number</h1>

<p>I'm thinking of a number between <strong>1</strong> and <strong>100</strong>.</p>
<p>Enter your guess below and click <strong>Guess</strong>.</p>

<div>
    <label for="guessInput">Your guess:</label>
    <input type="number" id="guessInput" min="1" max="100">
    <button id="guessButton">Guess</button>
    <button id="resetButton">Reset Game</button>
</div>

<div class="result">
    <strong>Result:</strong> <span id="resultText">-</span>
</div>

<div class="attempts">
    <strong>Attempts:</strong> <span id="attemptsCount">0</span>
</div>

<div class="log">
    <strong>Guess History:</strong>
    <ul id="logList"></ul>
</div>

<script>
    const guessInput = document.getElementById('guessInput');
    const guessButton = document.getElementById('guessButton');
    const resetButton = document.getElementById('resetButton');
    const resultText = document.getElementById('resultText');
    const attemptsCount = document.getElementById('attemptsCount');
    const logList = document.getElementById('logList');

    function addLogEntry(guess, result) {
        const li = document.createElement('li');
        const time = new Date().toLocaleTimeString();
        li.textContent = `[${time}] You guessed ${guess} → ${result}`;
        logList.prepend(li); // newest on top
    }

    async function updateAttempts() {
        try {
            const resp = await fetch('/game/attempts');
            if (resp.ok) {
                const attempts = await resp.text();
                attemptsCount.textContent = attempts;
            }
        } catch (e) {
            console.error('Failed to fetch attempts:', e);
        }
    }

    guessButton.addEventListener('click', async () => {
        const value = guessInput.value;
        if (!value) {
            resultText.textContent = 'Please enter a number.';
            return;
        }

        try {
            const resp = await fetch('/game/guess?number=' + encodeURIComponent(value));
            if (!resp.ok) {
                resultText.textContent = 'Error: ' + resp.status;
                return;
            }
            const result = await resp.text();
            resultText.textContent = result;
            addLogEntry(value, result);
            await updateAttempts();
        } catch (e) {
            console.error(e);
            resultText.textContent = 'Request failed.';
        }
    });

    resetButton.addEventListener('click', async () => {
        try {
            const resp = await fetch('/game/reset', {method: 'POST'});
            if (!resp.ok) {
                resultText.textContent = 'Error resetting game.';
                return;
            }
            const msg = await resp.text();
            resultText.textContent = msg + ' (New number chosen)';
            attemptsCount.textContent = '0';
            logList.innerHTML = '';
            guessInput.value = '';
        } catch (e) {
            console.error(e);
            resultText.textContent = 'Reset failed.';
        }
    });

    // allow Enter key to trigger guess
    guessInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            guessButton.click();
        }
    });

    // initial attempts fetch
    updateAttempts();
</script>
</body>
</html>
